<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HomeTV">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>HomeTV Remote</title>
</head>
<body>
  <section id="pair" class="screen" hidden>
    <h1>HomeTV</h1>
    <p>Pair this phone with your TV.</p>
    <button id="show-pin" class="primary">Show PIN on TV</button>
    <form id="pair-form" hidden>
      <input id="pin" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" aria-label="PIN shown on the TV">
      <input id="device-name" maxlength="40" placeholder="Name this phone" aria-label="Phone name">
      <button class="primary" type="submit">Pair</button>
    </form>
    <p id="pair-message" class="message" role="status"></p>
  </section>

  <section id="main" class="screen" hidden>
    <header>
      <span id="status-dot" class="dot" aria-hidden="true"></span>
      <span id="now-showing">Home</span>
      <button id="sleep" class="icon" aria-label="Sleep">⏻</button>
    </header>

    <div class="topbar">
      <button data-key="volumeDown" data-repeat aria-label="Volume down" class="glyph">
        <svg viewBox="0 0 28 24" aria-hidden="true"><path d="M3 9h4l6-5v16l-6-5H3a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1z" fill="currentColor"/><path d="M17 9.2a4 4 0 0 1 0 5.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button data-key="volumeUp" data-repeat aria-label="Volume up" class="glyph">
        <svg viewBox="0 0 28 24" aria-hidden="true"><path d="M3 9h4l6-5v16l-6-5H3a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1z" fill="currentColor"/><path d="M17 9.2a4 4 0 0 1 0 5.6M20.2 6.4a8 8 0 0 1 0 11.2M23.4 3.6a12 12 0 0 1 0 16.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button data-key="back">Back</button>
      <button id="home" class="accent">Home</button>
    </div>

    <!-- Opens by itself when a text field on the TV has focus; what's typed goes to the TV as you type. -->
    <form id="keyboard" class="keyboard" hidden>
      <input id="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"
             placeholder="Type on TV…" aria-label="Type on the TV">
      <button type="button" data-key="backspace" data-repeat aria-label="Delete">⌫</button>
      <button type="button" id="keyboard-close" aria-label="Close keyboard">✕</button>
    </form>

    <div id="tab-touchpad" class="tab">
      <!-- Open apps: tap to switch (or, in split screen, to give a tile the sound), ⧉ to split, ✕ to close. -->
      <ul id="open-list" class="open-list" hidden></ul>
      <div class="touch-wrap">
        <div id="touchpad" aria-label="Touchpad: drag to move, tap to click, two-finger tap to right-click"></div>
        <div id="scrollstrip" aria-label="Scroll strip"></div>
      </div>
    </div>

  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
